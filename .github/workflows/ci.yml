name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DATABASE_URL: postgresql://reelforge:reelforge@localhost:5432/reelforge
  S3_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_REGION: us-east-1
  AUTH_SECRET: ci-only-secret-not-for-production
  APP_URL: http://localhost:3000
  # No FAL_KEY / RESEND_API_KEY: StubProvider + console OTP — zero external AI calls in CI.

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter web typecheck && pnpm --filter @reelforge/shared typecheck
      - run: pnpm test

  worker-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reelforge
          POSTGRES_PASSWORD: reelforge
          POSTGRES_DB: reelforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reelforge" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec prisma migrate deploy
      - run: |
          cd services/worker
          pip install -r requirements.txt -r requirements-dev.txt
          if [ -f requirements-media.txt ]; then pip install -r requirements-media.txt; fi
          pytest -m "not integration" -q
          pytest -m integration -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick fonts-noto-core
      - run: pnpm install --frozen-lockfile
      - name: Start infra (postgres + minio + worker)
        run: docker compose -f infra/docker-compose.dev.yml up -d --build
      - run: pnpm --filter web exec prisma migrate deploy
      - run: pnpm seed
      - run: bash scripts/make_fixtures.sh
        if: hashFiles('scripts/make_fixtures.sh') != ''
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
