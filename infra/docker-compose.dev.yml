services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reelforge
      POSTGRES_PASSWORD: reelforge
      POSTGRES_DB: reelforge
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelforge"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/originals local/derived local/renders local/generated &&
      echo buckets ready
      "

  worker:
    build:
      context: ../services/worker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://reelforge:reelforge@postgres:5432/reelforge
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      S3_BUCKET_ORIGINALS: originals
      S3_BUCKET_DERIVED: derived
      S3_BUCKET_RENDERS: renders
      S3_BUCKET_GENERATED: generated
      WORKER_CONCURRENCY: "2"
      FAL_KEY: "${FAL_KEY:-}"
      MODEL_CACHE_DIR: /models
    ports:
      - "8001:8001"
    volumes:
      - ../services/worker/worker:/app/worker # live-reload mount (dev)
      # model weights are baked into the image at /models — no volume, or it would
      # shadow them with an empty dir and force a re-download on first use
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request;urllib.request.urlopen("http://localhost:8001/healthz", timeout=2)''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  pg-data:
  minio-data:
